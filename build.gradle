plugins { id 'com.android.application' version '8.11.1' }

android {
    namespace 'com.jy.notewatermark'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jy.notewatermark'
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName '3.4.0'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            resources.srcDirs = ['resources']
        }
    }
    buildTypes { release { minifyEnabled false } }
    // The hook reports BuildConfig.VERSION_NAME so the UI can spot a stale injected copy.
    buildFeatures { buildConfig true }
    // lintVital pulls a large toolchain that cannot be resolved on this network.
    lint { checkReleaseBuilds false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging { resources.excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
}
